name: Snapshot Clan Battle Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Record and push snapshot (retries on conflict)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            node .github/scripts/snapshot.mjs
            git add history.json resolved_names.json alert_state.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot clan battle data"
            git push && exit 0
            echo "Push rejected — retrying from latest gh-pages"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1
