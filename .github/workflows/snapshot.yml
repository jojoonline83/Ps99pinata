name: Snapshot Clan Battle Data

on:
  schedule:
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Skip if a recent run already took a snapshot
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_ok=$(gh run list --repo "${{ github.repository }}" --workflow snapshot.yml --status completed --json databaseId,createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          if [ -n "$last_ok" ]; then
            age=$(( $(date +%s) - $(date -d "$last_ok" +%s) ))
            if [ "$age" -lt 300 ]; then
              echo "Last snapshot completed ${age}s ago — skipping."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Record and push snapshot (retries on conflict)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            node .github/scripts/snapshot.mjs
            git add history.json resolved_names.json alert_state.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: snapshot clan battle data"
            git push && exit 0
            echo "Push rejected — retrying from latest gh-pages"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
          done
          echo "::error::Failed to push snapshot after 5 attempts"
          exit 1
