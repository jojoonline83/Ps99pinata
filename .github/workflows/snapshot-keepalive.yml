name: Snapshot Keepalive

on:
  workflow_run:
    workflows: ["Snapshot Clan Battle Data"]
    types: [completed]

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait 9 minutes then re-trigger snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting 540s before re-dispatching snapshot…"
          sleep 540
          gh workflow run snapshot.yml --repo "${{ github.repository }}" --ref main
          echo "Re-dispatch sent."
