name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ps99-pinata-leaderboard-8ihk03]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          FILES="index.html players.html style.css app.js players.js .nojekyll .github/scripts/snapshot.mjs .github/scripts/league_snapshot.mjs .github/workflows/snapshot.yml .github/workflows/league_snapshot.yml .github/workflows/deploy.yml league/index.html league/app.js"
          for f in $FILES; do
            git checkout ${{ github.sha }} -- "$f" 2>/dev/null || echo "Skipping $f (not in source)"
          done
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "deploy: sync from ${{ github.ref_name }}"
          git push origin gh-pages
