name: Discord Alert

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        default: '<@&967089828837597264> jojo8 and javierplayz are dc'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set"
            exit 1
          fi
          curl -s -X POST \
            -H "Content-Type: application/json" \
            "$DISCORD_WEBHOOK" \
            -d "{\"content\":\"${{ github.event.inputs.message }}\",\"allowed_mentions\":{\"roles\":[\"967089828837597264\"]}}"
